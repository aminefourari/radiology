name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Every UI string and data name (structures, ECGs, cases, key levels) in every language.
      - run: node --test tests/i18n.test.js tests/translations.test.js

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Tests need only these; TotalSegmentator/torch from requirements.txt is for building cases.
      - run: pip install numpy scipy nibabel pytest
      - run: pytest pipeline -q
