<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CT Anatomy Atlas</title>
<meta name="description" content="Open, multilingual atlas of CT anatomy with labelled structures in axial, coronal and sagittal views. Educational use only.">
<meta name="theme-color" content="#0f141b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1 data-t="app.title">CT Anatomy Atlas</h1>
    <p id="case-title" class="case-title"></p>
  </div>
  <div class="top-actions">
    <select id="case-select" hidden aria-label="Case" data-t-aria="case.label"></select>
    <select id="lang-select" aria-label="Language" data-t-aria="lang.label"></select>
    <button id="btn-structures" class="btn" data-t="ctl.structures">Structures</button>
    <button id="btn-settings" class="btn" data-t="ctl.settings">Settings</button>
  </div>
</header>

<section class="systems" aria-labelledby="systems-title">
  <div class="row-head">
    <h2 id="systems-title" data-t="systems.title">Systems · toggle on and off</h2>
    <div class="pair">
      <button id="sys-all" class="btn small" data-t="ctl.all">All</button>
      <button id="sys-none" class="btn small" data-t="ctl.none">None</button>
    </div>
  </div>
  <div id="system-bar" class="system-bar" role="group"></div>
</section>

<section class="controls">
  <div id="plane-group" class="segmented" role="radiogroup"></div>
  <div class="zoom">
    <button id="zoom-out" class="btn icon" aria-label="Zoom out" data-t-aria="ctl.zoomOut">−</button>
    <output id="zoom-val">100%</output>
    <button id="zoom-in" class="btn icon" aria-label="Zoom in" data-t-aria="ctl.zoomIn">+</button>
    <button id="zoom-fit" class="btn" data-t="ctl.fit">Fit</button>
    <button id="move" class="btn" aria-pressed="false" data-t="ctl.move">Move</button>
  </div>
  <label class="window"><span data-t="win.label">Window</span>
    <select id="win-select"></select>
  </label>
  <button id="focus" class="btn" aria-pressed="false" data-t="ctl.focus">Focus</button>
</section>

<main class="viewer-wrap">
  <div class="viewer-head" dir="ltr">
    <span id="plane-info"></span>
    <span id="hu-readout" class="hu">HU —</span>
  </div>
  <div id="viewer" class="viewer" dir="ltr" tabindex="0">
    <canvas id="canvas"></canvas>
    <svg id="labels" class="labels" aria-hidden="true"></svg>
    <span class="mark top" id="mk-top"></span>
    <span class="mark bottom" id="mk-bottom"></span>
    <span class="mark left" id="mk-left"></span>
    <span class="mark right" id="mk-right"></span>
    <div id="popup" class="popup" hidden></div>
    <div id="loading" class="loading"><div class="bar"><i id="loading-bar"></i></div><p id="loading-text"></p></div>
  </div>
  <p id="hint" class="hint" data-t="tap.hint">Tap a structure to name it</p>
</main>

<section class="levels" aria-labelledby="levels-title">
  <h2 id="levels-title" data-t="keylevels">Key levels</h2>
  <div id="levels" class="level-bar"></div>
</section>

<section class="slicer" dir="ltr">
  <button id="prev" class="btn icon" aria-label="Previous slice" data-t-aria="ctl.prev">‹</button>
  <input id="slider" type="range" min="0" max="0" value="0" aria-label="Slice">
  <button id="next" class="btn icon" aria-label="Next slice" data-t-aria="ctl.next">›</button>
  <output id="slice-val"></output>
</section>

<footer class="foot">
  <p data-t="footer.disclaimer">Educational use only — not for diagnosis. Labels are generated automatically and reviewed by the community.</p>
  <p><a id="credit" href="https://doi.org/10.5281/zenodo.6802613" rel="noopener"></a></p>
  <p><a id="repo-link" hidden rel="noopener" data-t="footer.code">Source code &amp; error reports</a></p>
</footer>

<dialog id="dlg-structures" class="drawer">
  <div class="drawer-head"><h2 data-t="ctl.structures">Structures</h2><button class="btn small" data-close data-t="ctl.close">Close</button></div>
  <div id="structure-list"></div>
</dialog>

<dialog id="dlg-settings" class="drawer">
  <div class="drawer-head"><h2 data-t="ctl.settings">Settings</h2><button class="btn small" data-close data-t="ctl.close">Close</button></div>
  <label class="field"><span data-t="settings.opacity">Overlay opacity</span><input id="opacity" type="range" min="0" max="1" step="0.05" value="0.45"></label>
  <label class="check"><input id="labels-on" type="checkbox" checked> <span data-t="settings.labels">Show labels</span></label>
  <label class="check"><input id="outline" type="checkbox"> <span data-t="settings.outline">Outlines only</span></label>
</dialog>
</body>
</html>
