<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How the ECG is made</title>
<meta name="description" content="Watch a 3D heart depolarise and recover in step with a simulated 12-lead ECG and a ladder diagram, rhythm by rhythm. Educational use only.">
<meta name="theme-color" content="#0f141b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module" src="js/heartapp.js"></script>
</head>
<body class="heart-page">
<header class="top">
  <div class="brand">
    <h1><a href="./" data-t="heart.title">How the ECG is made</a></h1>
    <p id="rhythm-title" class="case-title"></p>
  </div>
  <div class="top-actions">
    <a class="btn" href="ecg.html" data-t="ecg.title">ECG Atlas</a>
    <select id="lang-select" aria-label="Language" data-t-aria="lang.label"></select>
  </div>
</header>

<section class="controls">
  <select id="rhythm-select" aria-label="Rhythm" data-t-aria="heart.rhythm"></select>
  <button id="play" class="btn" aria-pressed="false" data-t="heart.play">Play</button>
  <button id="replay" class="btn" data-t="heart.replay">Replay</button>
  <label class="window"><span data-t="heart.speed">Speed</span>
    <select id="speed" dir="ltr"><option value="0.1">0.1×</option><option value="0.2">0.2×</option><option value="0.5">0.5×</option><option value="1">1×</option></select>
  </label>
  <div id="waves" class="wave-toggles" role="group" aria-label="Waves" data-t-aria="ecg.waves" dir="ltr">
    <button class="btn small w-P" aria-pressed="false" data-k="P">P</button>
    <button class="btn small w-PR" aria-pressed="false" data-k="PR">PR</button>
    <button class="btn small w-QRS" aria-pressed="false" data-k="QRS">QRS</button>
    <button class="btn small w-ST" aria-pressed="false" data-k="ST">ST</button>
    <button class="btn small w-T" aria-pressed="false" data-k="T">T</button>
    <button class="btn small" aria-pressed="false" data-k="all" data-t="heart.all">All</button>
  </div>
  <div id="layout" class="segmented" role="radiogroup" dir="ltr">
    <button class="btn small" role="radio" data-layout="3x4">3×4</button>
    <button class="btn small" role="radio" data-layout="12x1">12×1</button>
  </div>
</section>

<div class="heart-grid">
  <div class="heart-main">
    <div class="scrub" dir="ltr">
      <input id="scrub" type="range" min="0" step="1" value="0" aria-label="Time" data-t-aria="heart.time">
      <span id="clock" class="clock"></span>
    </div>
    <main class="viewer-wrap">
      <div id="paper" class="paper" dir="ltr">
        <svg id="trace" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ECG"></svg>
        <svg id="ladder" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ladder diagram" data-t-aria="heart.ladder"></svg>
      </div>
      <p class="hint" data-t="heart.ladder">Ladder diagram</p>
    </main>
    <p id="caption" class="caption" aria-live="polite"></p>

    <section class="hearts">
      <div class="heart-pane fixed-pane">
        <div class="pane-head"><span data-t="heart.view.outside">Outside</span></div>
        <div id="heart-fixed" class="heart-view"></div>
      </div>
      <div class="heart-pane">
        <div class="pane-head">
          <div id="view-select" class="segmented" role="radiogroup" aria-label="View" data-t-aria="heart.view">
            <button class="btn small" role="radio" data-view="outside" data-t="heart.view.outside">Outside</button>
            <button class="btn small" role="radio" data-view="4ch" data-t="heart.view.4ch">Four-chamber cut</button>
            <button class="btn small" role="radio" data-view="sax" data-t="heart.view.sax">Short-axis cut</button>
            <button class="btn small" role="radio" data-view="chest" data-t="heart.view.chest">In the chest</button>
          </div>
        </div>
        <div id="heart-main" class="heart-view"></div>
        <p id="chest-hint" class="hint" hidden></p>
      </div>
    </section>
    <ul class="legend">
      <li><i class="lg-front"></i><span data-t="heart.legend.front">Depolarising</span></li>
      <li><i class="lg-plateau"></i><span data-t="heart.legend.plateau">Depolarised</span></li>
      <li><i class="lg-repol"></i><span data-t="heart.legend.repol">Recovering</span></li>
      <li><i class="lg-rest"></i><span data-t="heart.legend.rest">At rest</span></li>
    </ul>

    <section id="whatif" class="reading whatif" hidden>
      <h2 data-t="heart.whatif">What if…</h2>
      <div class="whatif-row">
        <label class="check"><input type="checkbox" data-w="cutRbb"> <span data-t="heart.whatif.cutRbb">Cut the right bundle</span></label>
        <label class="check"><input type="checkbox" data-w="cutLbb"> <span data-t="heart.whatif.cutLbb">Cut the left bundle</span></label>
        <label class="check"><input type="checkbox" data-w="blockNode"> <span data-t="heart.whatif.blockNode">Block the AV node</span></label>
        <label class="check"><input type="checkbox" data-w="accessory"> <span data-t="heart.whatif.accessory">Add an accessory pathway</span></label>
        <label class="check"><input type="checkbox" data-w="extraBeat"> <span data-t="heart.whatif.extraBeat">Add an early beat</span></label>
        <label class="window"><span data-t="heart.whatif.avDelay">AV node delay (PR)</span>
          <input id="av-delay" type="range" min="120" max="400" step="10" value="160"><output id="av-out" dir="ltr"></output>
        </label>
        <button id="whatif-reset" class="btn small" data-t="heart.whatif.reset">Reset</button>
      </div>
      <p id="becomes" class="becomes"></p>
    </section>
  </div>

  <aside id="why" class="reading why"></aside>
</div>

<footer class="foot">
  <p data-t="heart.disclaimer">A teaching model. Educational use only.</p>
  <p><a href="heart/LICENSE.txt" data-t="heart.credit">Heart model: Z-Anatomy (CC BY-SA 4.0), from BodyParts3D</a></p>
  <p><a id="repo-link" hidden rel="noopener" data-t="footer.code">Source code &amp; error reports</a></p>
</footer>
</body>
</html>
